apiVersion: v1
kind: Namespace
metadata:
  name: frontend-dev
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: manager-pwa-dev
  namespace: frontend-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: manager-pwa-dev
  template:
    metadata:
      labels:
        app: manager-pwa-dev
    spec:
      containers:
        - name: manager-pwa
          image: alstn67/hechyeomoyeo-manager-pwa:dev
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: manager-pwa-dev-service
  namespace: frontend-dev
spec:
  type: ClusterIP
  selector:
    app: manager-pwa-dev
  ports:
    - port: 3000
      targetPort: 3000
